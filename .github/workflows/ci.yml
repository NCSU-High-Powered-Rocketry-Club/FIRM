name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  firmware:
    name: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.3.Rel1"
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build firmware
        run: just build-firmware

  firmware-tests:
    name: firmware-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Ceedling
        run: gem install ceedling -v 1.0.1
      - name: Firmware Unity tests (Ceedling)
        run: just test-firmware

  host-eskf:
    name: host-eskf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Host ESKF and wire-layout tests
        run: just test-host

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: cargo test
        run: just test-rust
      - name: clippy and rustfmt
        run: just lint-rust

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: uv sync
        run: just sync
      - name: pytest (default markers)
        run: just test-python

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: uv sync
        run: uv sync --group dev
      - name: ruff
        run: just lint-ruff
      - name: clang-format
        run: just lint-clang

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: uv sync
        run: just sync
      - name: Build TypeScript / WASM client
        working-directory: client
        run: npm ci
      - name: pytest -m integration
        run: just test-integration
