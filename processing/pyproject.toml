[project]
name = "firm-hprc"
version = "0.4.0"
description = "Filtered Inertial Rotation Module"
readme = "README.md"
authors = [
    { name = "High Powered Rocketry Club", email = "ncsurocketry@gmail.com"}
]
requires-python = ">=3.10,<3.16"
license = "MIT"
dependencies = [
    "dash>=2.16",
    "hprm>=0.2.0",
    "numpy>=2.0",
    "pandas>=2.3.3",
    "plotly>=5.20",
    "polars>=1.30",
    "pyyaml>=6.0.3",
]
keywords = [
    "firm",
    "flight computer",
    "python",
    "rocketry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
"Homepage" = "https://ncsurocketry.org"
"Bug Tracker" = "https://github.com/NCSU-High-Powered-Rocketry-Club/FIRM/issues"
"Source Code" = "https://github.com/NCSU-High-Powered-Rocketry-Club/FIRM/"

[project.optional-dependencies]
usb = [
    "firm-client",
]

[project.scripts]
firm-eskf = "firm.eskf_lab.cli:main"
firm-log = "firm.flight_data.cli:main"
firm-reconstruct = "firm.flight_data.reconstruct:main"
firm-trace = "firm.cli.trace:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firm"]

[tool.hatch.build]
exclude = [
    "/firm/eskf_lab/native",
    "/firm/eskf_lab/config",
    "/firm/eskf_lab/README.md",
]
