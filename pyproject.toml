[project]
name = "firm-workspace"
version = "0.2.0"
description = "FIRM workspace: firmware, USB client, and post-flight processing"
requires-python = ">=3.10,<3.16"
license = "MIT"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["processing", "client"]

[tool.uv.sources]
firm-client = { workspace = true }

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff>=0.14.1",
    "ty>=0.0.1a23",
    "maturin>=1.8",
    "ziglang",
]

[tool.ruff]
line-length = 100
show-fixes = true
target-version = "py310"
exclude = ["scripts"]

[tool.ruff.lint]
typing-extensions = false
# TODO: UP035 should not be ignored
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PERF203", "UP035", "PYI021", "PYI048", "PYI020", "T201", "S101", "D100", "D103", "D101"]
select = ["E", "F", "I", "PL", "UP", "RUF", "PTH", "C4", "B", "PIE", "SIM", "RET", "RSE",
          "G", "ISC", "PT", "ASYNC", "TCH", "SLOT", "PERF", "PYI", "FLY", "AIR", "RUF022",
          "RUF023", "Q", "INP", "W", "YTT", "DTZ", "ARG", "T20", "FURB", "DOC", "TRY",
          "D100", "D101", "D102", "D103", "D300", "D418", "D419", "S"]

[tool.ruff.lint.per-file-ignores]
"processing/firm/eskf_lab/*.py" = ["TRY003"]
"processing/firm/flight_data/*.py" = ["D102", "D103", "TC001", "TC003", "TRY003", "TRY004"]
"processing/firm/flight_data/cli.py" = ["T201"]
"processing/firm/flight_data/reconstruct.py" = ["T201"]
"processing/firm/eskf_lab/cli.py" = ["T201"]
"processing/firm/eskf_lab/native.py" = ["S603", "TRY300"]
"processing/firm/eskf_lab/profile.py" = ["TRY004"]
"processing/firm/eskf_lab/visualize.py" = ["PLC0415"]
"processing/firm/cli/trace.py" = ["T201"]
"tests/processing/*.py" = ["S101", "TC003"]
"tests/integration/test_*.py" = ["S101"]
"client/tests/*.py" = ["S101"]
"client/firm_python/examples/*.py" = ["T201", "INP001"]

[tool.pytest.ini_options]
testpaths = ["tests", "client/tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: end-to-end integration tests for the mocked USB pipeline",
]
